name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning scripts/pvecb scripts/lib/common.sh scripts/steps/*.sh scripts/*.sh
      - name: bash -n
        run: for f in scripts/pvecb scripts/lib/*.sh scripts/steps/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: inventory parses and dry-run lists steps
        run: |
          pip install --quiet pyyaml
          cp inventory.example.yaml inventory.yaml
          scripts/pvecb list
          source scripts/lib/common.sh && INVENTORY=inventory.yaml load_inventory && test "$(nodes | wc -l)" = 3 && test "$(q 'sdn.evpn.vnets[1].name')" = dmz
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: recipes declare required front-matter and sections
        run: |
          fail=0
          for f in $(find recipes -name '*.md' ! -name '_TEMPLATE.md'); do
            for k in '^id:' '^tested:' '^risk:'; do grep -qE "$k" "$f" || { echo "$f missing $k"; fail=1; }; done
            for s in Preconditions Steps Verify Rollback Gotchas; do grep -qE "^## $s" "$f" || { echo "$f missing ## $s"; fail=1; }; done
          done
          exit $fail
      - name: no private identifiers
        run: |
          ! grep -rniE '192\.168\.86\.|BEGIN (RSA|OPENSSH) PRIVATE KEY|PVEAPIToken=[a-z0-9@!]+=[0-9a-f-]{36}' --exclude-dir=.git .
  galley:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: web (typecheck, lint, test, build)
        working-directory: dashboard/web
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
      - name: go vet + gofmt
        run: go vet ./cmd/... ./internal/... ./docs/... && test -z "$(gofmt -l cmd internal docs)"
      - name: go test (race)
        run: go test -race -count=1 ./cmd/... ./internal/... ./docs/...
      - name: build static binaries with embedded UI
        run: |
          for a in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -o /tmp/galley-$a ./cmd/galley; done
          /tmp/galley-amd64 --version
      - name: installer lint
        run: shellcheck -S warning install/galley-lxc.sh
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/web/package-lock.json
            dashboard/e2e/package-lock.json
      - name: build web and the binary with the embedded UI
        run: make web build
      - name: install the e2e suite and Chromium
        working-directory: dashboard/e2e
        run: npm ci && npx tsc --noEmit && npx playwright install --with-deps chromium
      - name: run the e2e suite against galley --demo
        working-directory: dashboard/e2e
        run: npx playwright test
      - name: upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard/e2e/playwright-report/
            dashboard/e2e/test-results/
          retention-days: 14
